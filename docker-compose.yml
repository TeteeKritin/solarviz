version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarviz_db
      POSTGRES_USER: solarviz
      POSTGRES_PASSWORD: solarviz_secret
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarviz -d solarviz_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solarviz_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    privileged: true
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    networks:
      - solarviz_net
    expose:
      - "8000"
    devices:
      - "/dev/ttyAMA0:/dev/ttyAMA0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - solarviz_net
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - solarviz_net
  
  pzem-reader:
    build:
      context: ./pzem
      dockerfile: Dockerfile
    container_name: solarviz-pzem
    restart: always
    privileged: true
    devices:
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    environment:
      - PZEM_PORT=/dev/ttyAMA0
      - PZEM_BAUDRATE=9600
      - PZEM_DEVICE_ID=1
      - API_BASE=http://172.17.0.1/api/v1
      - API_EMAIL=kritin.te@gmail.com
      - API_PASSWORD=reborn1212
      - READ_INTERVAL=30
    depends_on:
      - nginx
    networks:
      - solarviz_net

volumes:
  postgres_data:

networks:
  solarviz_net:
    driver: bridge